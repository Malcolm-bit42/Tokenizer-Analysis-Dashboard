services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevents local node_modules from overriding container
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    tty: true

  backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      ports:
        - "8000:8000"
      volumes:
        - ./backend:/app
        - ./backend/dev:/app/dev
        - hf_cache:/root/.cache/huggingface # Persists downloaded tokenisers
      command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
      environment:
        - PYTHONUNBUFFERED=1
        - HF_HOME=/root/.cache/huggingface
        - HF_TOKEN=${HF_TOKEN:-} 
      tty: true

  precompute:
      build:
        context: ./backend
        dockerfile: Dockerfile
      volumes:
        - ./backend:/app
        - ./backend/dev:/app/dev
        - hf_cache:/root/.cache/huggingface
      command: >
        sh -c "
          echo '[cron] Precompute service started';
          while true; do
            echo '[cron] Running precompute at $$(date)';
            python3 precompute.py;
            echo '[cron] Next run in 24 hours...';
            sleep 86400;
          done
        "
      environment:
        - PYTHONUNBUFFERED=1
        - HF_HOME=/root/.cache/huggingface
        - HF_TOKEN=${HF_TOKEN:-}
      restart: unless-stopped

volumes:
  hf_cache: # Declares persistent volume on host machine