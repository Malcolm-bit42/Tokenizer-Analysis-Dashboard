services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevents local node_modules from overriding container
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    tty: true

  backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      ports:
        - "8000:8000"
      volumes:
        - ./backend:/app
        - ./backend/dev:/app/dev
        - hf_cache:/root/.cache/huggingface # Persists downloaded tokenizers
      command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
      environment:
        - PYTHONUNBUFFERED=1
        - HF_HOME=/root/.cache/huggingface
      tty: true

volumes:
  hf_cache: # Declares persistent volume on host machine